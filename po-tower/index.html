<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PO Control Tower</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dispatch-office wall board. Quiet slate surfaces, one teal accent for actions, and signal colours reserved for status. */
:root{
  --bg:#f3f5f7;--surface:#ffffff;--surface2:#eaeef2;--ink:#16202c;--ink2:#4a5868;--ink3:#7a8794;--line:#d8dee5;
  --accent:#0b6b63;--accent-ink:#ffffff;--accent-soft:#d9efec;
  --crit:#b42318;--crit-soft:#fbe4e1;--warn:#a15c07;--warn-soft:#fbecc9;--ok:#1f7a45;--ok-soft:#d8f0e1;--info:#2456a6;--info-soft:#dde8f9;--mute-soft:#e6e9ed;
  --shadow:0 1px 2px rgba(20,32,44,.06),0 4px 14px rgba(20,32,44,.05);
  --display:'IBM Plex Sans Condensed','IBM Plex Sans','Segoe UI',Arial,sans-serif;--body:'IBM Plex Sans','Segoe UI',Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d;--surface:#17212b;--surface2:#1f2b37;--ink:#e6ecf2;--ink2:#a9b6c3;--ink3:#7f8e9c;--line:#2b3a48;
  --accent:#3fb8ab;--accent-ink:#06211e;--accent-soft:#143b38;
  --crit:#ff8a7d;--crit-soft:#3d1d1a;--warn:#f0b254;--warn-soft:#3a2a0e;--ok:#6fd69b;--ok-soft:#173326;--info:#8fb4f5;--info-soft:#172a47;--mute-soft:#232f3b;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f161d;--surface:#17212b;--surface2:#1f2b37;--ink:#e6ecf2;--ink2:#a9b6c3;--ink3:#7f8e9c;--line:#2b3a48;
  --accent:#3fb8ab;--accent-ink:#06211e;--accent-soft:#143b38;
  --crit:#ff8a7d;--crit-soft:#3d1d1a;--warn:#f0b254;--warn-soft:#3a2a0e;--ok:#6fd69b;--ok-soft:#173326;--info:#8fb4f5;--info-soft:#172a47;--mute-soft:#232f3b;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600;text-wrap:balance}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand b{font:600 18px var(--display);letter-spacing:.2px}
.brand span{font-size:11px;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--mute-soft);color:var(--ink2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.pill.live{background:var(--ok-soft);color:var(--ok)}.pill.live i{background:var(--ok)}
.pill.snap{background:var(--warn-soft);color:var(--warn)}.pill.snap i{background:var(--warn)}
.pill.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.busy i{animation:none}}
.field{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink3)}
.field select,.field input{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px;font-size:13px;color:var(--ink)}
.grow{flex:1}
.search{position:relative;min-width:220px;flex:1;max-width:340px}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:0 10px;font-family:var(--mono);font-size:13px}
.results{position:absolute;left:0;right:0;top:38px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:30}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer}
.results button:hover{background:var(--surface2)}
.btn{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;border-top:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--ink2);white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .cnt{font-size:11px;background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:0 7px;font-weight:700}
main{padding:16px;max-width:1500px;width:100%;margin:0 auto}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.banner.err{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.grid{display:grid;gap:12px}
.g8{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin-bottom:2px}
.card .sub{color:var(--ink3);font-size:12px;margin-bottom:10px}
.tile{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--line)}
.tile:hover{background:var(--surface2)}
.tile .l{font-size:12px;color:var(--ink2);font-weight:600}
.tile .v{font:600 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--ink3)}
.tile.crit{border-left-color:var(--crit)}.tile.warn{border-left-color:var(--warn)}.tile.ok{border-left-color:var(--ok)}.tile.info{border-left-color:var(--info)}
.rowbar{min-height:38px;display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:8px;align-items:center;width:100%;background:none;border:0;padding:5px 4px;border-radius:6px;cursor:pointer;text-align:left}
.rowbar:hover{background:var(--surface2)}
.rowbar .nm{font-size:13px;display:flex;gap:6px;align-items:center;min-width:0}
.rowbar .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.track b{display:block;height:100%;border-radius:6px;background:var(--accent)}
.track b.crit{background:var(--crit)}.track b.warn{background:var(--warn)}.track b.info{background:var(--info)}.track b.mute{background:var(--ink3)}.track b.ok{background:var(--ok)}
.rowbar .n{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px;text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.crit{background:var(--crit-soft);color:var(--crit)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.info{background:var(--info-soft);color:var(--info)}.tag.mute{background:var(--mute-soft);color:var(--ink2)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--surface2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input[type=text]{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border-radius:10px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px;max-height:75vh}
.col>h3{font-size:13px;padding:2px 4px;display:flex;justify-content:space-between;gap:6px}
.col .list{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--line)}
.pcard:hover{border-color:var(--accent)}
.pcard.crit{border-left-color:var(--crit)}.pcard.warn{border-left-color:var(--warn)}.pcard.info{border-left-color:var(--info)}
.pcard .t{display:flex;justify-content:space-between;gap:6px}
.pcard .m{font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:50;display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.drawer .bd{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.38);z-index:40}
.scrim[hidden]{display:none}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface2);min-width:0}
.step b{display:block;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
.step span{font-size:12.5px;font-weight:600}
.step.done{background:var(--ok-soft);border-color:var(--ok)}.step.done b{color:var(--ok)}
.step.late{background:var(--crit-soft);border-color:var(--crit)}.step.late b{color:var(--crit)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);font-weight:600}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 8px;min-height:32px;font-weight:400}
.form textarea{min-height:70px;resize:vertical}
.dline{display:flex;gap:6px}.dline input{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}.kv dt{color:var(--ink3)}.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 14px;z-index:80;box-shadow:var(--shadow);max-width:90%}
.toast.err{background:var(--crit);color:#fff}
textarea.big{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-family:var(--mono);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:26px;text-align:center;color:var(--ink3)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);margin-bottom:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
svg text{fill:var(--ink2);font:11px var(--body)}
.links a{color:var(--accent);font-weight:600}
.small{font-size:12px;color:var(--ink3)}
@media (max-width:640px){.steps{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.search{max-width:none;min-width:100%}}

.plogo{height:18px;width:auto;border-radius:4px;vertical-align:-4px;margin-right:6px;flex:none}
.tile .l.plat{display:flex;align-items:center;font-size:13px}.tile .l.plat .plogo{height:26px;margin-right:8px}
.pcard .m .pl{display:inline-flex;align-items:center}.pcard .m .plogo{height:14px;margin-right:4px;vertical-align:middle}
.pn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.pn .plogo{margin-right:0}
.plogo.ph{display:inline-flex;align-items:center;justify-content:center;width:18px;font:700 10px var(--body);background:var(--surface2);color:var(--ink3);border:1px solid var(--line);box-sizing:border-box;vertical-align:middle}
.tile .l.plat .plogo.ph{width:26px;font-size:13px}.pcard .m .plogo.ph{width:14px;height:14px;font-size:8px}
.plogo.ph{text-transform:uppercase}

/* ===== v2 shell ===== */
[hidden]{display:none!important}
body{font-size:15px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:6px}
.mainc{min-width:0;display:flex;flex-direction:column}
.sb-brand{padding:2px 8px 12px}.sb-brand b{font:600 20px var(--display);letter-spacing:.2px;display:block}.sb-brand span{font-size:11.5px;color:var(--ink3)}
.sb-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.sb-h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:16px 10px 4px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:600;color:var(--ink2);font-size:14.5px;min-height:42px}
.sb-item:hover{background:var(--surface2)}
.sb-item.on{background:var(--accent-soft);color:var(--accent)}
.sb-item .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;flex-direction:column;line-height:1.2}
.sb-item .lb small{font-weight:400;font-size:11.5px;color:var(--ink3)}
.sb-item .bd{font-size:11.5px;background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:1px 8px;font-weight:700}
.ic{width:22px;height:22px;flex:none}
.plogo.sb{width:30px;height:30px;border-radius:7px;object-fit:cover;margin:0;vertical-align:middle}
.plogo.sb.ph{width:30px;height:30px;font-size:13px}
.plogo.xl{height:44px;width:auto;border-radius:10px;margin:0}
.plogo.xl.ph{width:44px;height:44px;font-size:18px}
.sb-foot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.acc{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2)}
.acc.edit{background:var(--ok-soft);border-color:var(--ok)}
.acc .al{display:flex;gap:8px;align-items:center;min-width:0}.acc .al span{display:flex;flex-direction:column;line-height:1.2;min-width:0}.acc .al small{color:var(--ink3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .ic{width:18px;height:18px}
.sb-conn{display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 20px}
.tb-title{display:flex;align-items:center;gap:12px}
.tb-title h1{font:600 24px/1.1 var(--display)}
nav.tabs{padding:0 14px}
nav.tabs button{padding:12px 14px;font-size:14.5px}
nav.tabs .cnt.info{background:var(--info-soft);color:var(--info)}
main{padding:20px;max-width:1560px}
body.viewonly .ed{display:none!important}
.lockbar{display:flex;align-items:center;gap:10px;background:var(--info-soft);color:var(--info);border:1px solid var(--info);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13.5px}
.lockbar .ic{width:18px;height:18px}.lockbar span{flex:1}
.drawer .lockbar{margin:0}
.grid.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.tile{padding:14px 16px}.tile .v{font-size:30px}
h2.sec{font-size:18px;margin:22px 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h2.sec .small{font:400 13px var(--body)}
.toolbar h2{font-size:20px}
.welcome{margin:2px 0 16px}.welcome h2{font-size:26px}.welcome p{margin:6px 0 0;color:var(--ink2);max-width:760px;font-size:15px}
.pc{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.pc:hover{border-color:var(--accent);transform:translateY(-1px)}
@media (prefers-reduced-motion:no-preference){.pc{transition:transform .12s,border-color .12s}}
.pc.crit{border-left-color:var(--crit)}.pc.warn{border-left-color:var(--warn)}
.pc.empty0{opacity:.62}
.pc.big{border-left-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 60%)}
.pc-top{display:flex;gap:12px;align-items:center}.pc-top b{font:600 19px/1.2 var(--display);display:block}
.allicon{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}.allicon .ic{width:24px;height:24px}
.pc-stats{display:flex;gap:18px;flex-wrap:wrap}
.pc .st{display:flex;flex-direction:column;min-width:80px}.pc .st b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}.pc .st span{font-size:12px;color:var(--ink3)}
.pc .st.warn b{color:var(--warn)}.pc .st.crit b{color:var(--crit)}
.pc-bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}.pc-bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.pc .go{font-weight:700;color:var(--accent);font-size:13.5px;margin-top:auto}
.hero{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .hl{display:flex;gap:14px;align-items:center}.hero .hl h2{font-size:20px}
.hero .hr{display:flex;gap:8px;flex-wrap:wrap}
.hero .btn .cnt{background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:13.5px;max-width:230px}
.filters input{min-width:190px;font-family:var(--mono)}
table{font-size:13.5px}td{padding:9px 10px}
.btn{height:36px;font-size:13.5px}.btn.sm{height:28px}
.field select{height:36px}
.search input{height:36px}
.pcard .m .pl{display:inline-flex;align-items:center}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;border-right:0;border-bottom:1px solid var(--line)}
  .sb-nav{flex-direction:row;overflow-x:auto;gap:6px;flex:none;padding-bottom:4px}
  .sb-item{width:auto;flex:none;white-space:nowrap}.sb-h{display:none}

  const r={n:0,value:0,accepted:0,notFul:0,undecided:0,accNotDisp:0,dispatched:0,invoiced:0,transit:0,grnP:0,rto:0,flags:0,expiring:0,undecidedValue:0,notDispValue:0,fillNum:0,fillDen:0,stage:{},flag:{},flagVal:{}};
  for(let i=1;i<=9;i++)r.stage[i]={n:0,v:0};for(let i=1;i<=10;i++){r.flag[i]=0;r.flagVal[i]=0;}
  for(const d of D){
    r.n++;r.value+=d.amt||0;if(d.dec==='Accepted')r.accepted++;
    r.stage[d.stage].n++;r.stage[d.stage].v+=d.amt||0;
    if(d.stage===9)r.notFul++;if(d.stage===1){r.undecided++;r.undecidedValue+=d.amt||0;}
    if(d.stage>=2&&d.stage<=4){r.accNotDisp++;r.notDispValue+=d.amt||0;}
    if(d.inv.n>0){r.dispatched++;r.invoiced+=d.invoiced;}
    if(d.stage===5)r.transit++;if(d.stage===6)r.grnP++;if(d.inv.rto>0)r.rto++;
    if(d.pri>0){r.flags++;r.flag[d.pri]++;r.flagVal[d.pri]+=(d.pri===6||d.pri===8||d.pri===9)?d.invoiced:(d.value||0);if(d.pri<=2)r.expiring++;}
    if(d.amt>0){r.fillNum+=d.invoiced;r.fillDen+=d.amt;}
  }
  r.fill=r.fillDen?r.fillNum/r.fillDen:0;
  return r;
}

/* End-to-end journey: has each PO reached each step (a later step implies the earlier ones) */
const JSTEPS=[
 {k:'recv',name:'PO received',hint:'Every PO that reached us'},
 {k:'acc',name:'Accepted',hint:'Order desk said yes'},
 {k:'hand',name:'Printout handed to warehouse',hint:'Printout given to a person'},
 {k:'ack',name:'Warehouse acknowledged',hint:'Warehouse confirmed it holds it'},
 {k:'inv',name:'Invoiced',hint:'Invoice raised'},
 {k:'disp',name:'Dispatched',hint:'Left with a courier or own vehicle'},
 {k:'deliv',name:'Delivered',hint:'Reached the platform warehouse'},
 {k:'grn',name:'GRN done',hint:'Platform confirmed receipt'}];
function journeyOf(d){
  const a=d.inv,n=a.n>0;
  const grn=a.list.some(l=>l.grn==='Done');
  const deliv=a.deliv>0||grn;
  const disp=n&&a.list.some(l=>l.disp||l.awb);
  const j={recv:true,grn,deliv,disp,inv:n};
  j.ack=!!d.ack||n;j.hand=!!d.handed||j.ack;j.acc=d.dec==='Accepted'||j.hand||n;
  return j;
}
function journey(D){
  const out=JSTEPS.map(s=>({k:s.k,name:s.name,hint:s.hint,n:0,v:0,rows:[]}));
  const by={};out.forEach(o=>by[o.k]=o);
  const side={rto:{n:0,v:0},cnRaised:{n:0,v:0},cnPending:{n:0,v:0},short:{q:0,v:0},dmg:{q:0,v:0},exc:{q:0,v:0},ewbHave:0,ewbNeed:0,
    ds:{},gs:{},handExplicit:0,declined:0,expired:0,lost:{}};
  for(const d of D){
    const j=journeyOf(d);
    out.forEach(o=>{if(j[o.k]){o.n++;o.v+=d.value||0;}});
    d.j=j;
    if(d.stage===9)side.declined++;
    if(d.handed)side.handExplicit++;
    for(const l of d.inv.list){
      const st=l.status||'(no status)';side.ds[st]=side.ds[st]||{n:0,v:0};side.ds[st].n++;side.ds[st].v+=l.val||0;
      const g=l.grn||'(no GRN info)';side.gs[g]=side.gs[g]||{n:0,v:0};side.gs[g].n++;side.gs[g].v+=l.val||0;
      if(l.status==='RTO'){side.rto.n++;side.rto.v+=l.val||0;}
      side.short.q+=l.sq||0;side.short.v+=l.sv||0;side.dmg.q+=l.dq||0;side.dmg.v+=l.dv||0;side.exc.q+=l.eq||0;side.exc.v+=l.ev||0;
      if(l.cn){side.cnRaised.n++;side.cnRaised.v+=l.cnv||0;}
    }
    if(d.inv.n>0){side.ewbNeed++;if(d.ewb)side.ewbHave++;}
    if(d.inv.cnP>0){side.cnPending.n++;side.cnPending.v+=d.inv.loss||0;}
  }
  return {steps:out,side};
}

function todayIso(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowStamp(){const d=new Date();return todayIso()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* --- unwrap whatever shape the connector returns --- */
function unwrap(res){
  let p=(res&&res.payload!==undefined)?res.payload:res;
  for(let i=0;i<3;i++){
    if(typeof p==='string'){try{p=JSON.parse(p);}catch(e){break;}}
    if(p&&p.structuredContent)p=p.structuredContent;
    else if(p&&Array.isArray(p.content)&&p.content[0]&&typeof p.content[0].text==='string'){try{p=JSON.parse(p.content[0].text);}catch(e){break;}}
    else if(p&&p.content&&typeof p.content==='object'&&!Array.isArray(p.content)&&p.values===undefined)p=p.content;
    else break;
  }
  return p||{};
}
const snake=a=>{const o={};Object.keys(a).forEach(k=>{o[k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())]=a[k];});return o;};
async function rawCall(tool,args){

    async()=>m.callTool(SERVER,tool,args),
    async()=>{const s=await m.server(SERVER);return s[tool](args);},
    async()=>m.callTool({server:SERVER,tool:tool,input:args}),
  ];

async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('potower|'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=5381;const t='potower|'+s;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return 'f'+h.toString(16);}
}

  monthly(){
    const rows=this.rows();const months=[];

    rows.forEach(d=>{if(!d.date)return;const y=+d.date.slice(0,4),m=+d.date.slice(5,7)-1;const o=months.find(x=>x.y===y&&x.m===m);if(o){o.r++;if(d.inv.n>0)o.d++;}});
    const last=months.reduce((a,x,i)=>x.r?i:a,0);const ms=months.slice(0,Math.max(last+1,6));
    const mx=Math.max.apply(null,ms.map(x=>x.r))||1;const W=640,H=210,pl=34,pb=26,pt=14,bw=(W-pl)/ms.length;
    let s='<div class="legend"><span><i style="background:var(--info)"></i>Received</span><span><i style="background:var(--ok)"></i>Dispatched</span></div><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="POs received and dispatched by month">';
    for(let g=0;g<=4;g++){const y=pt+(H-pt-pb)*(1-g/4);s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-5)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(mx*g/4)+'</text>';}
    ms.forEach((x,i)=>{const x0=pl+i*bw+bw*.14,w=bw*.34;const h1=(H-pt-pb)*x.r/mx,h2=(H-pt-pb)*x.d/mx;
      s+='<rect x="'+x0+'" y="'+(H-pb-h1)+'" width="'+w+'" height="'+h1+'" rx="2" fill="var(--info)"/><rect x="'+(x0+w+2)+'" y="'+(H-pb-h2)+'" width="'+w+'" height="'+h2+'" rx="2" fill="var(--ok)"/>';
      s+='<text x="'+(x0+w)+'" y="'+(H-8)+'" text-anchor="middle">'+MN[x.m]+'</text>';
      if(x.r)s+='<text x="'+(x0+w/2)+'" y="'+(H-pb-h1-3)+'" text-anchor="middle" style="font-size:10px">'+x.r+'</text>';});

function monthStart(iso,off){const y=+iso.slice(0,4),m=+iso.slice(5,7)-1+off;const d=new Date(Date.UTC(y,m,1));return d.toISOString().slice(0,10);}
Object.assign(UI,{
  inP(d){if(this.pkey==='all')return true;const f=this.f;return !!d.date&&d.date>=f.from&&d.date<=f.to;},
  setPeriod(k,from,to){
    const a=S.asof,f=this.f;this.pkey=k;
    if(k==='custom'){f.from=from||f.from||addDays(a,-30);f.to=to||f.to||a;if(f.from>f.to){const t=f.from;f.from=f.to;f.to=t;}return;}
    f.to=a;
    if(k==='last'){f.from=monthStart(a,-1);f.to=addDays(monthStart(a,0),-1);return;}
    f.from=k==='fy'?'2026-04-01':k==='90d'?addDays(a,-90):k==='30d'?addDays(a,-30):k==='7d'?addDays(a,-7):k==='month'?a.slice(0,8)+'01':'2000-01-01';
  },
  periodLabel(){return this.pkey==='custom'?fd(this.f.from)+' to '+fd(this.f.to):PERIODS.filter(x=>x[0]===this.pkey)[0][1];},
  periodBar(){

    const cust=this.pkey==='custom'?'<span class="pcust"><label>From<input type="date" id="f-from" value="'+esc(this.f.from)+'"></label><label>To<input type="date" id="f-to" value="'+esc(this.f.to)+'"></label><button class="btn pri sm" data-act="applyrange">Apply</button></span>':'';
    const sub=this.pkey==='all'?'All POs, any date':'POs dated '+fd(this.f.from)+' to '+fd(this.f.to);
    return '<div class="periodbar"><div class="pchips" role="group" aria-label="Period">'+chips+'</div>'+cust+'</div>';

  /* ---------- PIPELINE (end to end) ---------- */

/* ===== Website mode: replaces the Claude connector with the Apps Script backend ===== */
(function(){
  if(typeof claude!=='undefined'&&claude.use)return;            // running inside Claude: nothing to do
  const CFG=window.PO_CONFIG||{};
  let pinSent='',pinUser='';try{pinSent=sessionStorage.getItem('potower_pin_raw')||'';pinUser=sessionStorage.getItem('potower_pin_user')||'';}catch(e){}
  window.setEditPin=function(p,u){pinSent=p||'';pinUser=p?(u==null?pinUser:u):'';try{if(p){sessionStorage.setItem('potower_pin_raw',p);sessionStorage.setItem('potower_pin_user',pinUser);}else{sessionStorage.removeItem('potower_pin_raw');sessionStorage.removeItem('potower_pin_user');}}catch(e){}};
  const KEYNAME='potower_viewkey';
  let pendingKey=null;
  function askKey(msg){
    if(pendingKey)return pendingKey;
    pendingKey=new Promise(res=>{
      const d=document.createElement('div');d.className='keyov';
      d.innerHTML='<form class="keybox"><h2>Open PO Control Tower</h2><p>'+(msg||'Enter the access key your admin gave you. You only need to do this once on this device.')+'</p><input type="password" id="keyin" placeholder="Access key" autocomplete="current-password" autofocus><button class="btn pri" type="submit">Open</button></form>';
      document.body.appendChild(d);
      d.querySelector('form').onsubmit=ev=>{ev.preventDefault();const v=d.querySelector('#keyin').value.trim();if(!v)return;try{localStorage.setItem(KEYNAME,v);}catch(e){}d.remove();pendingKey=null;res(v);};
      setTimeout(()=>{const i=d.querySelector('#keyin');i&&i.focus();},50);
    });
    return pendingKey;
  }
  async function call(tool,args,retried){
    if(!CFG.backend)throw new Error('The website is not connected yet: set the backend URL in config.js');
    let key='';try{key=localStorage.getItem(KEYNAME)||'';}catch(e){}
    if(!key)key=await askKey();
    const body={key,tool,args,pin:pinSent,user:pinUser};
    const r=await fetch(CFG.backend,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j&&j.error==='unauthorized'){try{if(localStorage.getItem(KEYNAME)===key)localStorage.removeItem(KEYNAME);}catch(e){}await askKey('That key did not work. Try again.');return call(tool,args,false);}
    if(j&&j.error)throw new Error(j.error);
    return j;
  }
  window.claude={use:async()=>({callTool:async(server,tool,args)=>call(tool,args)})};
})();

<script>
/* ===== ACTIONS and wiring ===== */
function guessPlat(po){
  if(/^P\d{6,}$/.test(po))return 'Zepto';
  if(/^[A-Z0-9]{3}PO\d+$/.test(po))return 'Swiggy Instamart';
  if(/^FLS/.test(po))return 'Flipkart';
  if(/^\d{12,14}$/.test(po))return 'Blinkit';
  if(/^IRA/.test(po))return 'BigBasket';
  if(/^PUR-ORD/.test(po))return 'Supertails';
  return 'Other';
}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function mergeTrk(po,patch){
  const d=S.byPo&&S.byPo.get(po);
  const t=Object.assign({po:po},S.trk[po]||{},patch);
  t.updated=nowStamp();t.by=S.user||'';if(!t.plat&&d)t.plat=d.plat;
  S.trk[po]=t;return t;
}
function bulkSave(patches,label,detail){
  const fresh=[],old=[];
  patches.forEach(p=>{const had=!!S.trkRow[p.po];mergeTrk(p.po,p.patch);(had?old:fresh).push(p.po);});
  recompute();
  enqueue('batch',async()=>{
    if(fresh.length){
      const res=await sheets('append_values',{spreadsheetId:TRK_ID,range:'TRACKING!A1',values:fresh.map(po=>trkRowValues(S.trk[po]))});
      const up=(res.updates&&res.updates.updatedRange)||res.updatedRange||'';const m=String(up).match(/(\d+):[A-Z]+(\d+)$/);
      if(m){fresh.forEach((po,i)=>{S.trkRow[po]=+m[1]+i;});}
      else{const rows=await getRows(TRK_ID,'TRACKING!A2:A5000');rows.forEach((r,i)=>{S.trkRow[normPo(r[0])]=i+2;});}
    }
    for(const po of old){const r=S.trkRow[po];await sheets('update_values',{spreadsheetId:TRK_ID,range:'TRACKING!A'+r+':R'+r,values:[trkRowValues(S.trk[po])]});}
  });
  logAct('',label,detail,'');
  if(S.mode!=='live')saveLocal();
}
function handPatch(d,mode,today){
  const base={};
  if(mode==='accept')return {dec:'Accepted',printout:today};
  if(mode==='handed')return {dec:'Accepted',printout:(d&&d.printout)||today,handed:today,handedTo:UI.hand.person||''};
  if(mode==='ack')return {dec:'Accepted',printout:(d&&d.printout)||today,handed:(d&&d.handed)||today,ack:today,ackBy:UI.hand.person||S.user||''};
  if(mode==='decline')return {dec:'Declined',reason:UI.hand.reason};
  return base;
}
function applyBatch(createMissing){
  const list=UI.parseList(),today=S.asof,mode=UI.hand.mode;
  const known=list.filter(p=>S.byPo.get(p)),unknown=list.filter(p=>!S.byPo.get(p));
  if(mode==='handed'&&!(UI.hand.person||'').trim()){UI.toast('Enter who the printouts were handed to.',true);return;}
  const patches=known.map(p=>({po:p,patch:handPatch(S.byPo.get(p),mode,today)}));
  if(createMissing)unknown.forEach(p=>patches.push({po:p,patch:Object.assign({created:'Y',plat:guessPlat(p),date:today},handPatch(null,mode,today))}));
  if(!patches.length){UI.toast('Nothing to apply. Paste at least one PO number.',true);return;}
  const names={accept:'Accepted at order desk',handed:'Handed to warehouse',ack:'Warehouse acknowledged',decline:'Declined'};
  bulkSave(patches,'Batch: '+names[mode],(mode==='handed'?'to '+UI.hand.person+' · ':mode==='ack'&&UI.hand.person?'by '+UI.hand.person+' · ':'')+patches.length+' POs: '+patches.slice(0,5).map(p=>p.po).join(', ')+(patches.length>5?'…':''));
  UI.hand.text='';UI.toast(patches.length+' PO'+(patches.length===1?'':'s')+' updated'+(S.mode==='live'?' and saved to Google Sheets':' on this device'));UI.render();
}
function newIssue(po){
  const d=po&&S.byPo.get(po);
  return {isNew:true,id:nextIssueId(),raised:S.asof,po:po||'',plat:d?d.plat:'',type:ISSUE_TYPES[0],desc:'',by:S.user,owner:'',prio:'Medium',status:'Open',next:addDays(S.asof,1),updated:S.asof,note:'',resolution:'',resolved:''};
}
function readIssue(base){
  const x=Object.assign({},base);delete x.isNew;
  x.po=normPo(val('i-po'));x.type=val('i-type');x.desc=val('i-desc');x.owner=val('i-owner');x.prio=val('i-prio');x.status=val('i-status');x.next=val('i-next');x.note=val('i-note');x.resolution=val('i-res');
  const d=S.byPo.get(x.po);if(d)x.plat=d.plat;
  if(x.status==='Resolved'&&!x.resolved)x.resolved=S.asof;if(x.status!=='Resolved')x.resolved='';
  if(!x.by)x.by=S.user;
  return x;
}
function copyText(txt){
  try{navigator.clipboard.writeText(txt).then(()=>UI.toast('Copied. Paste into Sheets or Excel.'),()=>UI.toast('Copy was blocked by the browser.',true));}catch(e){UI.toast('Copy was blocked by the browser.',true);}
}
async function loadUsers(){try{const r=await sheets('user_list',{spreadsheetId:TRK_ID});S.users=r.users||[];}catch(e){S.users=S.users||[];}try{UI.render();}catch(e){}}
async function doUnlock(){
  let name=val('u-name');const pin=val('u-pin');
  if(!name){UI.toast('Enter your name.',true);return;}
  if(!S.pinHash){const p2=val('u-pin2');if(pin.length<4){UI.toast('The PIN needs at least 4 characters.',true);return;}if(pin!==p2){UI.toast('The two PINs do not match.',true);return;}savePin(await sha(pin));if(window.setEditPin){window.setEditPin(pin,name);S.role='admin';try{sessionStorage.setItem('potower_role','admin');}catch(e){}}}
  else if(window.setEditPin&&S.mode==='live'){            // website: the server checks name + PIN, nothing secret is stored in the browser
    window.setEditPin(pin,name);
    let r=null;try{r=await sheets('login',{spreadsheetId:TRK_ID});}catch(e){UI.toast('Could not check the PIN: '+e.message,true);window.setEditPin('');return;}
    if(!r||!r.ok){window.setEditPin('');UI.toast('Wrong name or PIN.',true);return;}
    S.role=r.role||'editor';try{sessionStorage.setItem('potower_role',S.role);}catch(e){}
    name=r.name||name;window.setEditPin(pin,name);
  }
  else if((await sha(pin))!==S.pinHash){UI.toast('Wrong PIN.',true);return;}
  S.edit=true;S.user=name;lsSet('potower_user',name);try{sessionStorage.setItem('potower_edit',name);}catch(e){}
  const back=UI.drawer&&UI.drawer.back;UI.drawer=back||null;UI.render();UI.toast('Editing unlocked. Changes are saved under '+name+'.');
}
function actionClick(act,arg,el){
  const today=S.asof;
  if(WRITE_ACTS.indexOf(act)>=0&&!S.edit){UI.toast('This is view-only. Unlock editing first.',true);UI.openDrawer({type:'unlock',back:UI.drawer&&UI.drawer.type!=='unlock'?UI.drawer:null});return;}
  switch(act){
    case 'tab':UI.view=arg;UI.render();window.scrollTo(0,0);break;
    case 'flag':UI.f.flag=String(arg);UI.f.team='ALL';UI.f.q='';UI.f.wlLimit=100;UI.view='worklist';UI.render();window.scrollTo(0,0);break;
    case 'stage':UI.f.stage=+arg;UI.view='pipeline';UI.render();window.scrollTo(0,0);break;
    case 'plat':
    case 'scope':UI.goScope(arg,el&&el.getAttribute('data-v')||'overview');UI.render();window.scrollTo(0,0);break;
    case 'home':UI.view='home';UI.render();window.scrollTo(0,0);break;
    case 'fac':UI.f.rg=UI.rgDefault();UI.f.rg.fac=arg;UI.view='register';UI.render();window.scrollTo(0,0);break;
    case 'rgpage':UI.f.rg.page=Math.max(0,UI.f.rg.page+(+arg));UI.render();window.scrollTo(0,0);break;
    case 'gap':UI.f.rg=UI.rgDefault();UI.f.rg.gap=arg;UI.view='register';UI.render();window.scrollTo(0,0);break;
    case 'applyrange':{const fr=$('#f-from').value,to=$('#f-to').value;if(!fr||!to){UI.toast&&UI.toast('Pick both dates','err');break;}UI.setPeriod('custom',fr,to);UI.f.rg.page=0;UI.render();break;}
    case 'period':UI.setPeriod(arg);UI.f.rg.page=0;UI.render();break;
    case 'claim':{const row=UI.claimRows(true).find(r=>r.key===arg);if(row)UI.openDrawer({type:'claim',claim:Object.assign({po:row.po,inv:row.inv,plat:row.plat,type:row.type,status:'Not raised'},S.claims[row.key]||{}),amt:row.claim,gap:row.gap,back:row.back,line:row.line});break;}
    case 'saveclaim':{
      const x=Object.assign({},UI.drawer.claim);x.status=val('c-status');
      const rv=val('c-rtoValue');x.rtoValue=rv===''?null:+rv;const cl=val('c-claimed'),st=val('c-settled');x.claimed=cl===''?null:+cl;x.settled=st===''?null:+st;x.raisedOn=val('c-raisedOn');x.ref=val('c-ref').trim();x.settledOn=val('c-settledOn');x.note=val('c-note');
      const nc=claimOf(UI.drawer.line,{rtoValue:x.rtoValue}),amtNow=nc?nc.amt:0;
      if(x.status!=='Not raised'&&x.claimed==null)x.claimed=amtNow;
      if(x.status!=='Not raised'&&!x.raisedOn)x.raisedOn=todayIso();
      if(x.status==='Settled'&&x.settled==null)x.settled=x.claimed;
      if(x.status==='Settled'&&!x.settledOn)x.settledOn=todayIso();
      if(x.claimed!=null&&x.claimed>amtNow+1){UI.toast('Claim raised is more than the amount to claim (₹'+Math.round(amtNow)+').',true);break;}
      saveClaim(x);UI.toast('Claim saved');UI.drawer=null;UI.render();break;}
    case 'clpage':{const g=UI.f.cl||(UI.f.cl=UI.clDefault());g.page=Math.max(0,g.page+(+arg));UI.render();break;}
    case 'copycl':{const r=UI.claimRows();copyText(['PO\tPlatform\tInvoice\tType\tDelivered\tInvoice Amount\tGRN Amount\tRTO Received\tClaim Amount\tStatus\tRaised\tSettled\tStill To Raise\tDays\tReference\tCredit Note\tReason\tRemarks'].concat(r.map(x=>[x.po,x.plat,x.inv,x.type,x.deliv||x.disp||'',Math.round(x.val),Math.round(x.gamt),Math.round(x.back),Math.round(x.claim),x.status,Math.round(x.claimed),Math.round(x.settled),Math.round(x.toRaise),x.age==null?'':x.age,x.ref,x.cn,x.why,x.note].join('\t'))).join('\n'));UI.toast('Copied '+r.length+' claims');break;}
    case 'rgreset':UI.f.rg=UI.rgDefault();UI.render();break;
    case 'copyreg':{const r=UI.regRows();copyText(['PO\tPlatform\tPO date\tFacility\tExpiry\tValue\tStage\tDecision\tProblem\tInvoices\tInvoice Nos\tAppointment\tDispatched\tDelivered\tPartner / AWB\tGRN Nos\tE-way Bill\tOwner'].concat(r.map(d=>[d.po,d.plat,d.date||'',d.loc,d.exp||'',Math.round(d.value||0),STAGES[d.stage-1].name,d.dec,d.pri?FLAGS[d.pri].name:'',d.inv.n||'',invCell(d).inv,d.appt||'',invCell(d).disp,invCell(d).deliv,invCell(d).awb,invCell(d).grn,d.ewb||'',d.owner].join('\t'))).join('\n'));break;}
    case 'unlock':UI.openDrawer({type:'unlock',back:UI.drawer&&UI.drawer.type!=='unlock'?UI.drawer:null});break;
    case 'dounlock':doUnlock();break;
    case 'usersave':{const n=val('nu-name'),p=val('nu-pin'),r=val('nu-role')||'editor';if(!n){UI.toast('Enter the person\'s name.',true);break;}
      sheets('user_set',{spreadsheetId:TRK_ID,name:n,pin:p,role:r,active:true}).then(x=>{S.users=x.users||S.users;UI.toast('Saved '+n+'.');UI.render();}).catch(e=>UI.toast(e.message,true));break;}
    case 'useractive':{const u=(S.users||[]).find(x=>x.name===arg);if(!u)break;
      sheets('user_set',{spreadsheetId:TRK_ID,name:u.name,role:u.role,active:!u.active}).then(x=>{S.users=x.users||S.users;UI.toast((u.active?'Switched off ':'Switched on ')+u.name+'.');UI.render();}).catch(e=>UI.toast(e.message,true));break;}
    case 'lock':if(window.setEditPin)window.setEditPin('');S.role='';S.edit=false;try{sessionStorage.removeItem('potower_edit');}catch(e){}UI.drawer=null;UI.render();UI.toast('Locked. The app is view-only again.');break;
    case 'savepin':{const p=val('new-pin');if(p.length<4){UI.toast('The PIN needs at least 4 characters.',true);break;}sha(p).then(async h=>{savePin(h);enqueue('pinset',async()=>{if(window.setEditPin)window.setEditPin(p);});UI.toast('Editor PIN changed.');UI.render();});break;}
    case 'po':UI.openDrawer({type:'po',po:arg});break;
    case 'accept':saveTrk(arg,{dec:'Accepted',printout:today},'Accepted','Accepted from worklist');UI.toast('Accepted '+arg);UI.render();break;
    case 'handed':UI.openDrawer({type:'hand1',po:arg,mode:'handed'});break;
    case 'ack':UI.openDrawer({type:'hand1',po:arg,mode:'ack'});break;
    case 'dohand1':{
      const dd=UI.drawer;const person=val('h1-person'),dt=val('h1-date')||today;
      if(!person){UI.toast(dd.mode==='handed'?'Enter who it was handed to.':'Enter who acknowledged it.',true);break;}
      const cur=S.byPo.get(dd.po)||{};
      if(dd.mode==='handed')saveTrk(dd.po,{handed:dt,handedTo:person,dec:'Accepted',printout:cur.printout||dt},'Handed to warehouse','to '+person+' on '+fd(dt));
      else saveTrk(dd.po,{ack:dt,ackBy:person,handed:cur.handed||dt},'Warehouse acknowledged','by '+person+' on '+fd(dt));
      UI.drawer=null;UI.toast((dd.mode==='handed'?'Handed to ':'Acknowledged by ')+person);UI.render();break;}
    case 'today':{const e=document.getElementById(arg);if(e)e.value=today;break;}
    case 'savepo':{
      const x=S.byPo.get(arg);const cur=S.trk[arg]||{};
      const patch={dec:val('e-dec'),reason:val('e-reason'),printout:val('e-printout'),owner:val('e-owner'),ewb:val('e-ewb'),exp:val('e-exp'),rem:val('e-rem')};['mInv','mInvVal','mDisp','mStatus','mPartner','mAwb','mDeliv','mGrnNo','mGrnDate','mGrnAmt','mAppt','dmgReason','shortReason'].forEach(k=>{patch[k]=val('e-'+k);});
      const changed=Object.keys(patch).filter(k=>String((k==='dec'||k==='reason'?(x&&x[k]):(k==='exp'?(x&&x.exp):(cur[k]!=null?cur[k]:(x&&x[k]))))||'')!==String(patch[k]||''));
      if(!changed.length){UI.toast('No changes to save.');break;}
      if(patch.dec==='Declined'&&!patch.reason){UI.toast('Pick a reason before declining.',true);break;}
      saveTrk(arg,patch,'Updated',changed.join(', '));UI.toast('Saved'+(S.mode==='live'?' to Google Sheets':' on this device'));UI.render();break;}
    case 'newissue':UI.openDrawer({type:'issue',issue:newIssue(arg)});break;
    case 'issue':{const i=S.issues.find(y=>y.id===arg);if(i)UI.openDrawer({type:'issue',issue:Object.assign({},i)});break;}
    case 'saveissue':{
      const x=readIssue(UI.drawer.issue);
      if(!x.desc){UI.toast('Describe what happened.',true);break;}
      saveIssue(x,UI.drawer.issue.isNew?'Issue logged':'Issue updated');UI.toast(x.id+' saved');UI.drawer=null;UI.render();break;}
    case 'newpo':UI.openDrawer({type:'newpo'});break;
    case 'savenewpo':{
      const po=normPo(val('n-po'));if(po.length<5){UI.toast('Enter the PO number.',true);break;}
      if(S.byPo.get(po)){UI.toast('That PO already exists. Opening it.',true);UI.openDrawer({type:'po',po});break;}
      const dec=val('n-dec');
      saveTrk(po,{created:'Y',plat:val('n-plat'),date:val('n-date'),exp:val('n-exp'),loc:val('n-loc'),qty:num(val('n-qty')),amt:num(val('n-amt')),dec:dec,printout:dec==='Accepted'?S.asof:''},'PO added',val('n-plat')+' '+(val('n-amt')?money(num(val('n-amt'))):''));
      UI.toast('PO '+po+' added');UI.openDrawer({type:'po',po});UI.render();break;}
    case 'day':UI.openDrawer({type:'day',day:arg});break;
    case 'close':UI.closeDrawer();break;
    case 'hmode':UI.hand.mode=arg;UI.render();break;
    case 'happly':applyBatch(false);break;
    case 'happlynew':applyBatch(true);break;
    case 'morewl':UI.f.wlLimit+=100;UI.render();break;
    case 'morekan':UI.f.kanLimit+=40;UI.render();break;
    case 'copywl':{const r=UI.wlRows();copyText(['Flag\tPO\tPlatform\tFacility\tExpiry\tValue\tAge\tOwner\tNext action'].concat(r.map(d=>[FLAGS[d.pri].name,d.po,d.plat,d.loc,d.exp||'',Math.round(d.value||0),d.age==null?'':d.age,FLAGS[d.pri].team,FLAGS[d.pri].act].join('\t'))).join('\n'));break;}
    case 'savecfg':{const c={};Object.keys(DEFAULT_CFG).forEach(k=>{const v=num(val('cfg-'+k));if(v!=null&&v>=0)c[k]=v;});saveCfg(c);UI.toast('Rules saved');UI.render();break;}
    case 'reload':loadLive();break;
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){actionClick(el.getAttribute('data-act'),el.getAttribute('data-arg')||'',el);return;}
  if(!e.target.closest('.search'))$('#results').hidden=true;
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='wl-flag'){UI.f.flag=e.target.value;UI.f.wlLimit=100;UI.render();}
  else if(id==='wl-team'){UI.f.team=e.target.value;UI.f.wlLimit=100;UI.render();}
  else if(id==='h-reason'){UI.hand.reason=e.target.value;}
  else if(id==='f-period'){UI.setPeriod(e.target.value);UI.f.rg.page=0;UI.render();}
  else if(id&&id.indexOf('cl-')===0&&id!=='cl-q'){const g=UI.f.cl||(UI.f.cl=UI.clDefault());g[id.slice(3)]=e.target.value;g.page=0;UI.render();}
  else if(id&&id.indexOf('rg-')===0&&id!=='rg-q'){UI.f.rg[id.slice(3)]=e.target.value;UI.f.rg.page=0;UI.render();}
  else if(id==='user-name'){S.user=e.target.value.trim();lsSet('potower_user',S.user);}
});
let tmr;
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='wl-q'){UI.f.q=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{const p=e.target.selectionStart;UI.f.wlLimit=100;UI.render();const n=$('#wl-q');if(n){n.focus();n.setSelectionRange(p,p);}},250);}
  else if(id==='h-person'){UI.hand.person=e.target.value;}
  else if(id==='h-text'){UI.hand.text=e.target.value;handPreview();}
  else if(id==='cl-q'){const g=UI.f.cl||(UI.f.cl=UI.clDefault());g.q=e.target.value;g.page=0;clearTimeout(tmr);tmr=setTimeout(()=>{const p=e.target.selectionStart;UI.render();const n=$('#cl-q');if(n){n.focus();n.setSelectionRange(p,p);}},250);}
  else if(id==='rg-q'){UI.f.rg.q=e.target.value;UI.f.rg.page=0;clearTimeout(tmr);tmr=setTimeout(()=>{const p=e.target.selectionStart;UI.render();const n=$('#rg-q');if(n){n.focus();n.setSelectionRange(p,p);}},250);}
  else if(id==='q')searchBox(e.target);
});
function handPreview(){
  const list=UI.parseList();const known=list.filter(p=>S.byPo.get(p)),unknown=list.filter(p=>!S.byPo.get(p));
  const pv=$('#h-preview');if(pv)pv.innerHTML='<b>'+known.length+'</b> found in the system'+(unknown.length?', <b style="color:var(--crit)">'+unknown.length+'</b> not found: '+unknown.slice(0,6).map(esc).join(', ')+(unknown.length>6?'…':''):'')+'. Date used: today ('+fd(S.asof)+').';
  const ac=$('#h-actions');if(ac)ac.innerHTML='<button class="btn pri" data-act="happly"'+(known.length||unknown.length?'':' disabled')+'>Apply to '+known.length+' PO'+(known.length===1?'':'s')+'</button>'+(unknown.length?'<button class="btn" data-act="happlynew">Create '+unknown.length+' missing PO'+(unknown.length===1?'':'s')+' and apply</button>':'');
}
/* global controls (the top bar is re-rendered, so everything is delegated) */
function searchBox(inp){
  const q=normPo(inp.value),box=$('#results');
  if(q.length<3){box.hidden=true;return;}
  const m=S.D.filter(d=>d.po.indexOf(q)>=0).slice(0,12);
  box.innerHTML=m.length?m.map(d=>'<button data-act="po" data-arg="'+esc(d.po)+'"><span class="mono">'+esc(d.po)+'</span><span class="small">'+esc(d.plat)+' · '+esc(STAGES[d.stage-1].short)+'</span></button>').join(''):'<div class="empty">No PO matches "'+esc(inp.value)+'"</div>';
  box.hidden=false;
}
$('#scrim').addEventListener('click',()=>UI.closeDrawer());
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.drawer)UI.closeDrawer();
  if(e.key==='Enter'&&UI.drawer&&UI.drawer.type==='unlock'&&/^u-/.test(e.target.id||''))doUnlock();
});

/* ---- start ---- */
unpackSnapshot();loadLocal();
S.pinHash=lsGet('potower_pin')||'';
try{const n=sessionStorage.getItem('potower_edit');if(n){S.edit=true;S.user=n;S.role=sessionStorage.getItem('potower_role')||'editor';}}catch(e){}
UI.f.rg=UI.rgDefault();UI.setPeriod('fy');
recompute();UI.render();
(async function boot(){
  if(typeof claude==='undefined'||!claude.use){S.diag.push('Google Sheets access is not available in this view.');UI.render();return;}
  const local=lsGet('potower_local');
  const ok=await loadLive();
  if(S.mode==='live'&&S.pinHash&&!S.pinInSheet)savePin(S.pinHash);
  if(window.setEditPin&&S.mode==='live')loadUsers();
  if(ok&&local&&local.trk){
    const keep=Object.keys(local.trk).filter(po=>!S.trk[po]);
    if(keep.length){bulkSave(keep.map(po=>({po,patch:local.trk[po]})),'Local entries synced',keep.length+' POs entered while offline');UI.toast(keep.length+' offline entries were saved to Google Sheets');}
    lsSet('potower_local',null);
  }
  setInterval(()=>{if(S.mode==='live'&&!S.busy&&!document.hidden&&!UI.drawer)Q.then(()=>loadLive());},300000);
})();
